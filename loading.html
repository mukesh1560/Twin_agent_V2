<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>TWIN AI M1</title>
<style>
  body { margin:0; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
         font-family:"Segoe UI",system-ui,sans-serif; background:#e0e7ff; color:#1e293b; text-align:center; padding:0 24px; }
  h2 { margin:0; }
  p { margin:0; color:#475569; }
  .dot { width:14px; height:14px; border-radius:50%; background:linear-gradient(135deg,#6366f1,#a855f7); animation:p 1.2s infinite ease-in-out; }
  @keyframes p { 0%,100% { transform:scale(.7); opacity:.5 } 50% { transform:scale(1.2); opacity:1 } }
  pre { max-width:720px; white-space:pre-wrap; text-align:left; color:#b91c1c; font-size:13px; }
</style></head>
<body>
  <div class="dot"></div>
  <h2>Starting TWIN AI M1…</h2>
  <p>The first launch can take a minute while the memory model loads.</p>
  <pre id="msg"></pre>
</body></html>
